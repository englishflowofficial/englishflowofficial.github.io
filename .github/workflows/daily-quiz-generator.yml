name: Daily Quiz Generator

on:
  # NOTE (2026-11-01): daily quiz generation moved to the Muse-side 09:42 IST
  # englishflow-daily-audit job (Gemini key lives in Muse's Secure Vault, not
  # in GitHub Secrets). Scheduled trigger disabled to avoid duplicate quiz
  # generation and daily failure emails; this workflow stays as a manual
  # backup via workflow_dispatch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate 2 quiz pages with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_quiz.py

      - name: Commit and push
        run: |
          git config user.name "englishflow-bot"
          git config user.email "bot@englishflow.local"
          git add quizzes/ sitemap.xml index.html
          git diff --cached --quiet || git commit -m "Daily quizzes: $(date -u +%F)"
          git push
