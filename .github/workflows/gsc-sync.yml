name: GSC Sync

on:
  schedule:
    - cron: '0 3 * * *'  # 08:30 IST daily
  workflow_dispatch:

permissions:
  contents: write

# Schedule-only (2026-11-06): the push trigger was removed — pushing several
# files in a row used to start competing sync runs that raced on the
# gsc_report.json commit/push and mailed failure notices. One run a day now;
# a manual dispatch cancels any run still in progress.
concurrency:
  group: gsc-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API deps
        run: pip install google-api-python-client google-auth

      - name: Run Search Console sync
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
        run: python3 scripts/sync_gsc.py

      - name: Commit and push report
        run: |
          git config user.name "englishflow-bot"
          git config user.email "bot@englishflow.local"
          git add gsc_report.json
          git diff --cached --quiet || git commit -m "GSC sync: $(date -u +%F)"
          git pull --rebase origin main
          git push
