name: Daily Quiz Generator

on:
  # NOTE (2026-11-01, updated 2026-11-03): daily quiz generation is owned by
  # the Muse-side 09:42 IST englishflow-daily-audit job. GEMINI_API_KEY now
  # lives in GitHub Repository Secrets. Scheduled trigger stays disabled to
  # avoid duplicate quiz generation; this workflow is the manual backup and
  # on-demand test route via workflow_dispatch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate 2 quiz pages with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_quiz.py

      - name: Commit and push
        run: |
          git config user.name "englishflow-bot"
          git config user.email "bot@englishflow.local"
          git add quizzes/ sitemap.xml index.html
          git diff --cached --quiet || git commit -m "Daily quizzes: $(date -u +%F)"
          git push
